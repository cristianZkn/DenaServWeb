# Pruebas automáticas en cada push y pull request: backend (Django + PostgreSQL) y frontend (tipos y compilación).
# Render y Vercel despliegan al hacer push a master por su cuenta; para que solo se publique si las pruebas pasan,
# active en GitHub «Require status checks» sobre master (Settings > Branches) con los trabajos «backend» y «frontend».
# No usa secretos: la base es un PostgreSQL desechable del propio trabajo.
name: Pruebas
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run   # el modelo y las migraciones deben coincidir
      - run: python manage.py test core --noinput

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
