# Backend en Render (capa gratuita). Crear con: Dashboard > New > Blueprint > este repositorio.
services:
  - type: web
    name: denaserv-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    # Un solo worker: la sincronización de precios guarda su estado en memoria del proceso.
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Valores que se escriben a mano en el panel de Render (no se guardan en el repositorio):
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_HOSTS
        sync: false            # ej: denaserv-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false            # ej: https://denaserv.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        sync: false            # ej: https://denaserv-api.onrender.com
      - key: WHATSAPP_NUMERO
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CRON_TOKEN
        sync: false            # llave del planificador semanal (mismo valor en el secreto CRON_TOKEN de GitHub)
